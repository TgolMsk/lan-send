name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: lan-send.exe
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: lan-send
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: lan-send
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p lan-send-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/lan-send-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.bin == 'lan-send.exe' && '.exe' || '' }}"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
