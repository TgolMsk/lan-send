name: Release

# Builds installable packages of the CLI and publishes them as a GitHub
# Release when a `v*` tag is pushed (or on demand for a dry run).
#
#   App      lan-send-<ver>-macos-universal.dmg (signed + notarized with the
#            APPLE_* / MACOS_* secrets, see docs/release.md),
#            lan-send-<ver>-windows-x86_64-setup.exe (NSIS) and
#            lan-send-<ver>-windows-x86_64.msi
#   iOS      uploaded to TestFlight when the APPSTORE_* secrets exist (the
#            .ipa is also attached to the release)
#   CLI      lan-send-cli-<ver>-macos-universal.pkg (+ .tar.gz),
#            lan-send-cli-<ver>-windows-x86_64.msi (+ .zip, + arm64 .zip),
#            lan-send-cli-<ver>-linux-{x86_64,aarch64}.tar.gz
#   SHA256SUMS.txt

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub Release (otherwise only build artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')-dev.${GITHUB_SHA::7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "version $tag"

  macos:
    name: CLI package (macOS)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
      MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release -p lan-send-cli --target aarch64-apple-darwin
          cargo build --release -p lan-send-cli --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          mkdir -p dist/root/usr/local/bin
          lipo -create -output dist/root/usr/local/bin/lan-send \
            target/aarch64-apple-darwin/release/lan-send \
            target/x86_64-apple-darwin/release/lan-send
          lipo -info dist/root/usr/local/bin/lan-send
      - name: Import signing certificates
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          if [ -n "$MACOS_INSTALLER_CERTIFICATE_P12" ]; then
            echo "$MACOS_INSTALLER_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          fi
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          echo "APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" | grep 'Developer ID Installer' | head -1 | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_ENV"
      - name: Sign the binary
        if: env.APP_IDENTITY != ''
        run: codesign --force --options runtime --timestamp --sign "$APP_IDENTITY" dist/root/usr/local/bin/lan-send
      - name: Package (.pkg and .tar.gz)
        run: |
          PKG="dist/lan-send-cli-${VERSION}-macos-universal.pkg"
          if [ -n "${INSTALLER_IDENTITY:-}" ]; then
            pkgbuild --root dist/root --identifier dev.lan-send.cli --version "${VERSION%%-*}" --install-location / --sign "$INSTALLER_IDENTITY" --timestamp "$PKG"
          else
            pkgbuild --root dist/root --identifier dev.lan-send.cli --version "${VERSION%%-*}" --install-location / "$PKG"
          fi
          tar -C dist/root/usr/local/bin -czf "dist/lan-send-cli-${VERSION}-macos-universal.tar.gz" lan-send
          ls -la dist
      - name: Notarize
        if: env.INSTALLER_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          PKG="dist/lan-send-cli-${VERSION}-macos-universal.pkg"
          xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$PKG"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.pkg
            dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: CLI package (Windows)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release -p lan-send-cli --target x86_64-pc-windows-msvc
          cargo build --release -p lan-send-cli --target aarch64-pc-windows-msvc
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked
      - name: MSI (x86_64)
        # Run inside the package so the relative `wix\License.rtf` in main.wxs resolves.
        shell: bash
        working-directory: crates/cli
        run: |
          mkdir -p ../../dist
          cargo wix --package lan-send-cli --no-build --nocapture \
            --install-version "${VERSION%%-*}" \
            --target x86_64-pc-windows-msvc \
            --output "../../dist/lan-send-cli-${VERSION}-windows-x86_64.msi"
      - name: Zips
        shell: bash
        run: |
          (cd target/x86_64-pc-windows-msvc/release && 7z a "../../../dist/lan-send-cli-${VERSION}-windows-x86_64.zip" lan-send.exe)
          (cd target/aarch64-pc-windows-msvc/release && 7z a "../../../dist/lan-send-cli-${VERSION}-windows-arm64.zip" lan-send.exe)
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  app-macos:
    name: App bundle (macOS universal)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Tauri signs and notarizes on its own when APPLE_* are present, and an
      # empty variable already counts as present, so export them only when the
      # secrets are configured.
      - name: Signing secrets
        shell: bash
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$P12" ]; then
            { echo "APPLE_CERTIFICATE<<EOF"; echo "$P12"; echo "EOF"; } >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
            echo "signing: certificate configured"
          else
            echo "signing: no certificate, the app will be unsigned"
          fi
          if [ -n "$ID" ] && [ -n "$APP_PASSWORD" ] && [ -n "$TEAM" ]; then
            echo "APPLE_ID=$ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APP_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$TEAM" >> "$GITHUB_ENV"
            echo "notarization: configured"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/app/pnpm-lock.yaml
      - name: Frontend dependencies
        working-directory: apps/app
        run: pnpm install --frozen-lockfile
      - name: Build the app (.app + .dmg)
        working-directory: apps/app
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config "{\"version\":\"${VERSION%%-*}\"}"
      - name: Collect
        run: |
          mkdir -p dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/lan-send-${VERSION}-macos-universal.dmg"
          ditto -c -k --keepParent target/universal-apple-darwin/release/bundle/macos/LanSend.app "dist/lan-send-${VERSION}-macos-universal.app.zip"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: app-macos
          path: dist/*
          if-no-files-found: error

  app-windows:
    name: App bundle (Windows x86_64)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/app/pnpm-lock.yaml
      - name: Frontend dependencies
        working-directory: apps/app
        run: pnpm install --frozen-lockfile
      - name: Build the app (.msi + NSIS .exe)
        working-directory: apps/app
        shell: bash
        run: pnpm tauri build --bundles msi,nsis --config "{\"version\":\"${VERSION%%-*}\"}"
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/bundle/msi/*.msi "dist/lan-send-${VERSION}-windows-x86_64.msi"
          cp target/release/bundle/nsis/*-setup.exe "dist/lan-send-${VERSION}-windows-x86_64-setup.exe"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: app-windows
          path: dist/*
          if-no-files-found: error

  ios-testflight:
    name: iOS (TestFlight)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # App Store Connect API key: Tauri signs with automatic provisioning
      # (cloud-managed certificate + profile) and altool uploads with it.
      APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Secrets present?
        id: gate
        shell: bash
        run: |
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPSTORE_PRIVATE_KEY" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY / APPLE_TEAM_ID not configured; skipping TestFlight (see docs/release.md)"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.ready == 'true'
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/app/pnpm-lock.yaml
      - name: Frontend dependencies
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/app
        run: pnpm install --frozen-lockfile
      - name: Tauri CLI (the Xcode build phase calls `cargo tauri`)
        if: steps.gate.outputs.ready == 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version 2.11.4 --no-confirm
          cargo tauri --version
      - name: App Store Connect API key
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
      - name: Build the .ipa (App Store Connect export)
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/app
        shell: bash
        run: |
          # version → CFBundleShortVersionString, bundleVersion → CFBundleVersion (unique per upload)
          cargo tauri ios build --ci --export-method app-store-connect \
            --config "{\"version\":\"${VERSION%%-*}\",\"bundle\":{\"iOS\":{\"developmentTeam\":\"${APPLE_TEAM_ID}\",\"bundleVersion\":\"${GITHUB_RUN_NUMBER}\"}}}"
          ls -la src-tauri/gen/apple/build/arm64/
          plutil -p src-tauri/gen/apple/build/lan-send-app_iOS.xcarchive/Products/Applications/*.app/Info.plist | grep -E "DisplayName|ShortVersion|CFBundleVersion|NSLocalNetwork" || true
      - name: Upload to TestFlight
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/app
        shell: bash
        run: |
          IPA=$(ls src-tauri/gen/apple/build/arm64/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          mkdir -p ../../dist && cp "$IPA" "../../dist/lan-send-${VERSION}-ios.ipa"
      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          name: app-ios
          path: dist/*.ipa
          if-no-files-found: error

  app-mas:
    name: App bundle (Mac App Store)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      MAS_CERTIFICATE_P12: ${{ secrets.MAS_CERTIFICATE_P12 }}
      MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
      MAS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MAS_INSTALLER_CERTIFICATE_P12 }}
      MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
      MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
    steps:
      - name: Secrets present?
        id: gate
        shell: bash
        run: |
          if [ -n "$MAS_CERTIFICATE_P12" ] && [ -n "$MAS_INSTALLER_CERTIFICATE_P12" ] && [ -n "$MAS_PROVISIONING_PROFILE" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPSTORE_PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MAS_* secrets not configured; skipping the Mac App Store build (see docs/release.md)"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.ready == 'true'
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/app/pnpm-lock.yaml
      - name: Frontend dependencies
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/app
        run: pnpm install --frozen-lockfile
      - name: Build the unsigned universal .app
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/app
        run: pnpm tauri build --target universal-apple-darwin --bundles app --config "{\"version\":\"${VERSION%%-*}\",\"bundle\":{\"macOS\":{\"hardenedRuntime\":false}}}"
      - name: Import certificates
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          KEYCHAIN=$RUNNER_TEMP/mas.keychain-db
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$MAS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MAS_INSTALLER_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$MAS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/installer.p12" -P "$MAS_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          echo "APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -E 'Apple Distribution|3rd Party Mac Developer Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" | grep -E '3rd Party Mac Developer Installer|Mac Installer Distribution' | head -1 | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_ENV"
      - name: Sign for the Mac App Store and build the .pkg
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          APP=target/universal-apple-darwin/release/bundle/macos/LanSend.app
          echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$APP/Contents/embedded.provisionprofile"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION%%-*}" "$APP/Contents/Info.plist"
          codesign --force --sign "$APP_IDENTITY" --entitlements apps/app/src-tauri/entitlements/mas.plist "$APP"
          codesign --verify --verbose=2 "$APP"
          mkdir -p dist
          productbuild --component "$APP" /Applications --sign "$INSTALLER_IDENTITY" "dist/LanSend-${VERSION}-mac-app-store.pkg"
      - name: Upload to App Store Connect
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          xcrun altool --upload-app --type macos --file "dist/LanSend-${VERSION}-mac-app-store.pkg" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          name: app-mas
          path: dist/*.pkg
          if-no-files-found: error

  linux:
    name: CLI archive (Linux ${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p lan-send-cli --target ${{ matrix.target }}
      - name: Archive
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/lan-send-cli-${VERSION}-linux-${{ matrix.arch }}.tar.gz" lan-send
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, app-macos, app-windows, app-mas, ios-testflight, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        shell: bash
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## \[?" + re.escape(version) + r"\]?[^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = match.group(1).strip() if match else "See CHANGELOG.md."
          body += "\n\n---\n**应用**：macOS 打开 `.dmg` 把 lan-send 拖进“应用程序”（未签名版本首次打开需在“系统设置 › 隐私与安全性”允许），Windows 运行 `-setup.exe`（或 `.msi`）。**命令行**：`lan-send-cli-*` 的 `.pkg` / `.msi` 会把 `lan-send` 加入 PATH，压缩包免安装。校验和见 `SHA256SUMS.txt`。"
          open("release-notes.md", "w", encoding="utf-8").write(body)
          PY
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: lan-send ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.VERSION, '-') || startsWith(env.VERSION, '0.') }}
          files: dist/*
