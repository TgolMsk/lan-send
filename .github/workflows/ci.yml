name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # Linux is a CI host only: the Tauri app would need GTK / WebKitGTK there.
      - name: Clippy (Linux, without the app)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --exclude lan-send-app --all-targets -- -D warnings
      - name: Test (Linux, without the app)
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude lan-send-app
      - uses: pnpm/action-setup@v4
        if: runner.os != 'Linux'
        with:
          version: 11
      - uses: actions/setup-node@v6
        if: runner.os != 'Linux'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/app/pnpm-lock.yaml
      - name: Frontend (type-check and build)
        if: runner.os != 'Linux'
        working-directory: apps/app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Clippy
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

  ios-check:
    name: iOS (cross-check core and app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/app/pnpm-lock.yaml
      - name: Frontend
        working-directory: apps/app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check core for iOS device
        run: cargo check -p lan-send-core --target aarch64-apple-ios
      - name: Check app for iOS simulator
        run: cargo check -p lan-send-app --lib --target aarch64-apple-ios-sim

  licenses:
    name: Licenses (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  cli-windows:
    name: CLI artifact (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p lan-send-cli
      - uses: actions/upload-artifact@v7
        with:
          name: lan-send-windows-x86_64
          path: target/release/lan-send.exe
          if-no-files-found: error

  cli-macos:
    name: CLI artifact (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p lan-send-cli
      - uses: actions/upload-artifact@v7
        with:
          name: lan-send-macos-arm64
          path: target/release/lan-send
          if-no-files-found: error

  interop:
    name: Interop with official LocalSend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build CLI
        run: cargo build -p lan-send-cli
      - name: Install pexpect
        run: python3 -m pip install pexpect pyte
      - name: Run interop tests
        run: python3 tests/interop/run.py --ours target/debug/lan-send
