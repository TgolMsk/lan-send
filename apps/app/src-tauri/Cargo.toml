[package]
name = "lan-send-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "lan-send desktop and mobile application (Tauri 2): macOS, Windows, iOS."
publish = false

[lib]
# Tauri mobile needs a static/dynamic library; the desktop binary links the rlib.
name = "lan_send_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lan-send-core = { path = "../../../crates/core", version = "0.2.0" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[lints]
workspace = true
