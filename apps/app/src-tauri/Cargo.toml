[package]
name = "lan-send-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "lan-send desktop and mobile application (Tauri 2): macOS, Windows, iOS."
publish = false

[lib]
# Tauri mobile needs a static/dynamic library; the desktop binary links the rlib.
name = "lan_send_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lan-send-core = { path = "../../../crates/core", version = "0.5.1" }
# 2.12.1 pulls in tao 0.37's single-scene lifecycle and retained scene config
# fixes, required for startup on iOS 27 when building with the iOS 27 SDK.
tauri = { version = "2.12.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# System language for the tray menu and dialogs (MIT OR Apache-2.0).
sys-locale = "0.3"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Security-scoped bookmarks for the receive folder inside the App Sandbox (ADR-0014).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSData", "NSError", "NSString", "NSArray", "NSDictionary", "NSObject"] }

[lints]
workspace = true
