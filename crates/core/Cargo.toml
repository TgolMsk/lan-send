[package]
name = "lan-send-core"
description = "Core library of lan-send: LocalSend v2.2 compatible discovery and transfer plus private extensions (clipboard sync, media). No GUI dependencies."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "lan_send_core"

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-util.workspace = true
uuid.workspace = true
sha2.workspace = true
parking_lot.workspace = true
# identity / TLS
rsa = { version = "0.9", features = ["sha2"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
x509-parser = { version = "0.18", features = ["verify"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "stream", "charset", "multipart"] }
axum = "0.8"
multer = "3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
# discovery
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
# misc
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
directories = "6"
gethostname = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
mime_guess = "2"
base64 = "0.22"
# media (ADR-0015): magic-byte sniffing, pure-Rust decoders for the common
# formats, EXIF orientation, audio tags. HEIC / AVIF come from the OS decoders.
infer = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
lofty = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
# NSPasteboard access and TIFF <-> PNG conversion through AppKit (ADR-0011).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSData", "NSDictionary", "NSURL", "NSObject", "NSEnumerator", "NSValue", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# ImageIO decodes HEIC / AVIF / everything else the OS knows (ADR-0015).
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFString", "CFURL", "CFDictionary", "CFNumber", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry", "CGDataProvider"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Clipboard access with an AddClipboardFormatListener-based monitor, and
# BMP <-> PNG conversion for CF_DIB (ADR-0011).
clipboard-win = { version = "5.4", features = ["monitor", "std"] }
# WIC decodes HEIC / AVIF when the codec extensions are installed (ADR-0015).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Imaging"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true

[lints]
workspace = true
