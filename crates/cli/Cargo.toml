[package]
name = "lan-send-cli"
description = "Command-line client of lan-send (macOS, Windows). Used for interoperability testing and headless use."
homepage = "https://github.com/TgolMsk/lan-send"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lan-send"
path = "src/main.rs"

[dependencies]
lan-send-core = { path = "../core", version = "0.3.0" }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
bytes.workspace = true
uuid.workspace = true
sha2.workspace = true
indicatif = "0.18"
time = { version = "0.3", features = ["formatting", "local-offset"] }
gethostname = "1"
mime_guess = "2"

[lints]
workspace = true
