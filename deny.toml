# cargo-deny configuration: enforces the "every dependency must be MIT-compatible"
# rule from the brief. Run locally with `cargo deny check`; CI runs it on every push.
[graph]
all-features = true
# Only the platforms we ship. Tauri on Linux links GTK / WebKitGTK (LGPL);
# Linux is a CI host, not a target (ADR-0001, ADR-0013).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    # Weak, file-level copyleft: modifying those files would have to be shared,
    # nothing about our MIT code changes. Only `option-ext` (via `directories`).
    "MPL-2.0",
    # Permissive data license of the Mozilla root store shipped by rustls'
    # `webpki-root-certs`; never used for verification here (peers are pinned).
    "CDLA-Permissive-2.0",
    # Boost Software License: permissive, attribution-free. `clipboard-win`.
    "BSL-1.0",
]
# Anything not listed above (GPL, AGPL, LGPL, MPL, SSPL, ...) fails the check and
# must be discussed before it is added.
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (crates/cli -> crates/core) carry no version on purpose.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
    # RSA is used only for local key generation and PKCS#8 encoding in
    # transport/identity.rs. Remote TLS signing/decryption uses rustls/ring,
    # not rsa's vulnerable private-key operations. No upstream fix exists.
    "RUSTSEC-2023-0071",
    # paste remains an unmaintained transitive dependency through lofty.
    # Tauri 2.12 removed unic, so its five historical exceptions were removed.
    "RUSTSEC-2024-0436",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
